server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # This routes your /api calls to the Laravel backend service
    location /api {
        proxy_pass http://backend-service:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}