apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30007 # Matches your previous setup
  selector:
    app: frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
spec:
  [cite_start]replicas: 2 # Matches proposal baseline
              selector:
                matchLabels:
                  app: frontend
              template:
                metadata:
                  labels:
                    app: frontend
                spec:
                  containers:
                    - name: frontend
                      image: voting-frontend:latest
                      imagePullPolicy: Never
                      resources:
                        limits:
                          [cite_start]cpu: "50m" # Required for HPA
                      ports:
                        - containerPort: 80