apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-storage-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  type: NodePort
  ports:
    - port: 9000
      targetPort: 9000
  selector:
    app: backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: voting-backend:v3
          imagePullPolicy: Never
          resources:
            limits:
              cpu: "100m"
            requests:
              cpu: "50m"
          env:
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: voting-secrets
                  key: APP_KEY
            - name: APP_DEBUG
              value: "true"
            - name: DB_CONNECTION
              value: "mysql"
            - name: DB_HOST
              value: "mysql-service"
            - name: DB_PORT
              value: "3306"
            - name: DB_DATABASE
              value: "voting_db"
            - name: DB_USERNAME
              value: "root"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: voting-secrets
                  key: DB_PASSWORD
            - name: VOTE_SALT
              valueFrom:
                secretKeyRef:
                  name: voting-secrets
                  key: VOTE_SALT
          ports:
            - containerPort: 9000
          # Readiness gate only: ensures traffic is withheld until Laravel has
          # booted (clean rollouts, no 502s). A liveness probe is intentionally
          # omitted here because `php artisan serve` is single-threaded, so a
          # pod that is busy serving an /api/heavy stress request would fail a
          # liveness check and be killed mid-test. Self-healing on real pod loss
          # is still handled by the Deployment/ReplicaSet controller.
          readinessProbe:
            httpGet:
              path: /up
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 8
            failureThreshold: 6
          # Shared, persistent storage for uploaded option images so every replica
          # sees the same files and they survive pod restarts/scaling. On a
          # single-node Minikube cluster a ReadWriteOnce volume is fine for all pods.
          volumeMounts:
            - name: option-images
              mountPath: /var/www/storage/app/public
      volumes:
        - name: option-images
          persistentVolumeClaim:
            claimName: backend-storage-pvc