apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  type: NodePort
  ports:
    - port: 9000
      targetPort: 9000
  selector:
    app: backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: voting-backend:v3
          imagePullPolicy: Never
          resources:
            limits:
              cpu: "100m"
            requests:
              cpu: "50m"
          env:
            - name: APP_KEY
              value: "base64:R6I/HxdTx9AQ7g/6uSJ1afs1qNsrMo8Qic7tRBeciGg="
            - name: APP_DEBUG
              value: "true"
            - name: DB_CONNECTION
              value: "mysql"
            - name: DB_HOST
              value: "mysql-service"
            - name: DB_PORT
              value: "3306"
            - name: DB_DATABASE
              value: "voting_db"
            - name: DB_USERNAME
              value: "root"
            - name: DB_PASSWORD
              value: "root"
          ports:
            - containerPort: 9000